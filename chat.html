<!doctype html>
<html lang="es-MX"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#123f4b"/><link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg"/><link rel="stylesheet" href="css/variables.css"/><link rel="stylesheet" href="css/base.css"/><link rel="stylesheet" href="css/components.css"/><title>Chat | ITEStore</title><style>.chat-page{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding-bottom:0}.chat-header{background:var(--surface);padding:1rem;border-bottom:1px solid var(--line);display:flex;gap:.75rem;align-items:center}.chat-messages{overflow-y:auto;padding:1rem;display:grid;align-content:start;gap:.65rem}.message{max-width:80%;background:var(--white);padding:.65rem .8rem;border-radius:14px 14px 14px 3px;box-shadow:0 2px 8px #123f4b10}.message.own{justify-self:end;background:#dcefe6;border-radius:14px 14px 3px 14px}.message small{display:block;margin-top:.25rem}.message-form{display:flex;gap:.5rem;padding:.75rem;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(.75rem + env(safe-area-inset-bottom))}.message-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:.7rem}.operation-panel{margin:0 1rem 1rem;padding:.85rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;gap:.55rem}.operation-panel p{margin:0;font-size:.85rem}.operation-actions{display:flex;flex-wrap:wrap;gap:.45rem}.operation-panel select,.operation-panel input{width:100%;padding:.45rem;border:1px solid var(--line);border-radius:7px}</style></head><body><main class="chat-page"><header class="chat-header"><a href="index.html#chats" class="icon-button" aria-label="Volver a chats">←</a><div><strong id="chat-title">Chat de operación</strong><small id="chat-subtitle">Cargando…</small></div></header><section id="messages" class="chat-messages" aria-live="polite"></section><section id="operation-panel" class="operation-panel" hidden></section><form id="message-form" class="message-form"><label class="sr-only" for="message-input">Mensaje</label><input id="message-input" name="content" maxlength="1500" required placeholder="Escribe un mensaje" autocomplete="off"/><button class="button" type="submit">Enviar</button></form></main><div id="toast-root" class="toast-root" aria-live="polite"></div><script type="module" src="js/chat.js"></script></body></html>
